<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Опрос про игру</title>
<style>
  body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #1a1a1a; color: #ddd; }
  a { color: #8fd; }
</style>
</head>
<body>
<p id="m">Загрузка опроса…</p>
<noscript><p><a href="https://docs.google.com/forms/d/e/1FAIpQLSecCFixbp6WtvgAZgsaIfqt0fHBmzXT82XR1TPwChrINGFAtQ/viewform?usp=dialog">Открыть опрос</a></p></noscript>
<script>
  // Адреса форм. Если форма не открывается, замените адрес здесь.
  var FORM_A = "https://docs.google.com/forms/d/e/1FAIpQLSecCFixbp6WtvgAZgsaIfqt0fHBmzXT82XR1TPwChrINGFAtQ/viewform?usp=dialog";
  var FORM_B = "https://docs.google.com/forms/d/e/1FAIpQLSeU4x5mCO5zZN5ajYNCY9N-0uhowMJEs8E-Ew8OIJli_Dd9zA/viewform?usp=dialog";

  (function () {
    var v = null;

    // Для проверки: ?v=a открывает форму A, ?v=b открывает форму B. Вариант не запоминается.
    try {
      var q = new URLSearchParams(location.search).get("v");
      if (q === "a" || q === "b") v = q;
    } catch (e) {}

    // Повторный заход того же человека в том же браузере: тот же вариант.
    if (!v) {
      try {
        var saved = localStorage.getItem("survey_variant");
        if (saved === "a" || saved === "b") v = saved;
      } catch (e) {}
    }

    // Новый посетитель: случайно 50/50.
    if (!v) {
      var r;
      try { r = crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296; }
      catch (e) { r = Math.random(); }
      v = r < 0.5 ? "a" : "b";
      try { localStorage.setItem("survey_variant", v); } catch (e) {}
    }

    location.replace(v === "a" ? FORM_A : FORM_B);
  })();
</script>
</body>
</html>
